<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trdoan | Personal Profile</title>
    
    <!-- Tối ưu SEO và chia sẻ link (Open Graph) -->
    <meta name="description" content="Hồ sơ cá nhân của Trdoan - Tối giản và Chuyên nghiệp.">
    <meta property="og:title" content="Trdoan | Personal Profile">
    <meta property="og:description" content="Hồ sơ cá nhân của Trdoan - Tối giản và Chuyên nghiệp.">
    <meta property="og:image" content="https://via.placeholder.com/1200x630">
    <meta property="og:type" content="website">

    <!-- Liên kết PWA và CSS -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="profile-header">
            <!-- Thay bằng ảnh avatar của bạn -->
            <img src="https://via.placeholder.com/150" alt="Trdoan Avatar" class="avatar">
            <h1>Trdoan</h1>
            <p class="tagline">Developer & Designer</p>
        </header>

        <section class="links-section">
            <a href="#" class="link-btn">GitHub</a>
            <a href="#" class="link-btn">LinkedIn</a>
            <a href="#" class="link-btn">Contact Me</a>
        </section>
    </div>

    <!-- Script gọi Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('Service Worker đăng ký thành công:', registration.scope))
                    .catch(err => console.log('Service Worker đăng ký thất bại:', err));
            });
        }
    </script>
</body>
</html>
